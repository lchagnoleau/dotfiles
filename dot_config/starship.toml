"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
[ $os ](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$mise\
$python\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[mise]
disabled = false
symbol = "󱁤 "
style = "bg:#212736"
format = '[[ $symbol$health ](fg:#769ff0 bg:#212736)]($style)'
healthy_symbol = 'ready'

[python]
symbol = " "
format = '[(\($symbol$virtualenv\))]($style)'

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'
conflicted = '[ ~$count](bold red bg:#394260)'
stashed = '[ *$count](bold yellow bg:#394260)'
staged = '[ +$count](bold yellow bg:#394260)'
modified = '[ !$count](bold yellow bg:#394260)'
deleted = '[ -$count](bold yellow bg:#394260)'
untracked = '[ ?$count](bold yellow bg:#394260)'
ahead = '[ ⇡$count](bold yellow bg:#394260)'
behind = '[ ⇣$count](bold yellow bg:#394260)'
diverged = '[ ⇡$ahead_count](bold yellow bg:#394260)[⇣$behind_count](bold yellow bg:#394260)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
